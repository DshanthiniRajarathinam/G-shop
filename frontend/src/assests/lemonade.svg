<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Fresh Lemonade Mason Jar -->
    <rect x="80" y="70" width="80" height="105" rx="14" fill="#fef08a" opacity="0.9"/>
    <rect x="90" y="58" width="60" height="14" rx="4" fill="#e2e8f0"/>
    <!-- Lemon slice floating -->
    <circle cx="120" cy="115" r="20" fill="#facc15" stroke="#fef08a" stroke-width="3"/>
    <!-- Straw -->
    <rect x="135" y="35" width="8" height="120" rx="3" fill="#ef4444" transform="rotate(15 135 35)"/>
  
  </g>
</svg>