<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Corn flour pack -->
    <path d="M 80 75 L 160 75 L 155 180 L 85 180 Z" fill="#fef9c3" stroke="#facc15" stroke-width="4"/>
    <circle cx="120" cy="120" r="26" fill="#fde047"/>
    <text x="120" y="125" font-family="Arial" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="middle">CORN</text>
    <text x="120" y="160" font-family="Arial" font-size="12" fill="#a16207" text-anchor="middle">STARCH</text>
  
  </g>
</svg>