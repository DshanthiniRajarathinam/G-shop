<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Dried Figs (Anjeer) -->
    <circle cx="110" cy="120" r="35" fill="#b45309"/>
    <circle cx="110" cy="120" r="30" fill="#d97706"/>
    <circle cx="110" cy="120" r="10" fill="#78350f"/>
    <!-- Stacked second fig -->
    <circle cx="140" cy="130" r="32" fill="#92400e" opacity="0.85"/>
    <circle cx="140" cy="130" r="26" fill="#b45309" opacity="0.85"/>
  
  </g>
</svg>