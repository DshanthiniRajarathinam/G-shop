<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- White chocolate bar slab -->
    <rect x="75" y="75" width="90" height="110" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="3"/>
    <line x1="120" y1="75" x2="120" y2="185" stroke="#fef08a" stroke-width="2"/>
    <line x1="75" y1="112" x2="165" y2="112" stroke="#fef08a" stroke-width="2"/>
    <line x1="75" y1="148" x2="165" y2="148" stroke="#fef08a" stroke-width="2"/>
  
  </g>
</svg>