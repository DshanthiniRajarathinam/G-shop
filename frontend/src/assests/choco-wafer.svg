<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Chocolate Wafer Bars -->
    <rect x="75" y="80" width="35" height="100" rx="4" fill="#78350f"/>
    <rect x="120" y="80" width="35" height="100" rx="4" fill="#78350f"/>
    <line x1="75" y1="105" x2="110" y2="105" stroke="#451a03" stroke-width="3"/>
    <line x1="75" y1="130" x2="110" y2="130" stroke="#451a03" stroke-width="3"/>
    <line x1="75" y1="155" x2="110" y2="155" stroke="#451a03" stroke-width="3"/>
    <line x1="120" y1="105" x2="155" y2="105" stroke="#451a03" stroke-width="3"/>
    <line x1="120" y1="130" x2="155" y2="130" stroke="#451a03" stroke-width="3"/>
    <line x1="120" y1="155" x2="155" y2="155" stroke="#451a03" stroke-width="3"/>
  
  </g>
</svg>