<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Arabian Dates -->
    <ellipse cx="105" cy="120" rx="26" ry="46" fill="#451a03" transform="rotate(-20 105 120)"/>
    <ellipse cx="140" cy="125" rx="24" ry="44" fill="#78350f" transform="rotate(25 140 125)"/>
    <ellipse cx="108" cy="115" rx="22" ry="40" fill="#713f12" transform="rotate(-20 108 115)" opacity="0.4"/>
  
  </g>
</svg>