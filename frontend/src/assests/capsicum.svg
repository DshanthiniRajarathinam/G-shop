<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Bell pepper stem -->
    <path d="M 120 50 Q 128 40 135 48 L 126 65 Z" fill="#15803d"/>
    <!-- Bell pepper body -->
    <path d="M 75 75 Q 65 130 85 175 Q 120 190 155 175 Q 175 130 165 75 Q 120 65 75 75 Z" fill="#16a34a"/>
    <path d="M 85 75 Q 92 130 98 175" stroke="#15803d" stroke-width="4" fill="none"/>
    <path d="M 155 75 Q 148 130 142 175" stroke="#15803d" stroke-width="4" fill="none"/>
    <!-- Glossy highlight -->
    <path d="M 90 85 Q 85 115 92 145" stroke="#86efac" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  </g>
</svg>