<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Ladyfinger / Okra -->
    <g transform="rotate(-30 120 120)">
      <!-- Cap -->
      <path d="M 70 110 L 85 100 L 95 110 L 85 125 Z" fill="#15803d"/>
      <path d="M 70 110 L 60 105" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
      <!-- Body -->
      <path d="M 85 105 Q 140 100 185 115 Q 140 120 85 120 Z" fill="#22c55e"/>
      <path d="M 90 112 Q 135 108 175 115" stroke="#16a34a" stroke-width="2" fill="none"/>
    </g>
  
  </g>
</svg>