<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Sack of rice flour -->
    <path d="M 80 85 C 80 75 160 75 160 85 L 165 180 C 165 190 75 190 75 180 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <ellipse cx="120" cy="85" rx="38" ry="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="120" y="140" font-family="Arial" font-size="16" font-weight="bold" fill="#64748b" text-anchor="middle">RICE</text>
    <text x="120" y="160" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">FLOUR</text>
  
  </g>
</svg>