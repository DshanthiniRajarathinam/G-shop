<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Fenugreek Seeds (Methi) -->
    <ellipse cx="120" cy="145" rx="55" ry="25" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <ellipse cx="120" cy="135" rx="46" ry="18" fill="#ca8a04"/>
    <polygon points="105,128 110,124 112,132" fill="#854d0e"/>
    <polygon points="122,126 127,122 129,130" fill="#854d0e"/>
    <polygon points="135,130 140,126 142,134" fill="#854d0e"/>
  
  </g>
</svg>