    <ellipse cx="120" cy="135" rx="46" ry="18" fill="#0f172a"/>
    <circle cx="105" cy="130" r="2.5" fill="#334155"/><circle cx="120" cy="128" r="2.5" fill="#334155"/>
    <circle cx="135" cy="132" r="2.5" fill="#334155"/>
  
  </g>
