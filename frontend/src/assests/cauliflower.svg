<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Leaves -->
    <path d="M 60 140 Q 65 190 120 195 Q 175 190 180 140 Z" fill="#16a34a"/>
    <path d="M 50 120 Q 70 170 100 180 Q 55 150 50 120 Z" fill="#15803d"/>
    <path d="M 190 120 Q 170 170 140 180 Q 185 150 190 120 Z" fill="#15803d"/>
    <!-- Curd -->
    <circle cx="95" cy="130" r="28" fill="#f8fafc"/>
    <circle cx="145" cy="130" r="28" fill="#f8fafc"/>
    <circle cx="120" cy="95" r="32" fill="#ffffff"/>
    <circle cx="90" cy="105" r="26" fill="#f1f5f9"/>
    <circle cx="150" cy="105" r="26" fill="#f1f5f9"/>
    <circle cx="120" cy="125" r="26" fill="#ffffff"/>
  
  </g>
</svg>