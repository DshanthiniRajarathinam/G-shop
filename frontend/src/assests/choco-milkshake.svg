<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Chocolate Milkshake -->
    <path d="M 85 75 L 155 75 L 140 185 L 100 185 Z" fill="#78350f"/>
    <!-- Cream swirl top -->
    <path d="M 80 75 Q 120 40 160 75 Z" fill="#f8fafc"/>
    <circle cx="120" cy="45" r="8" fill="#dc2626"/>
    <!-- Straw -->
    <rect x="135" y="25" width="7" height="130" rx="3" fill="#3b82f6" transform="rotate(12 135 25)"/>
  
  </g>
</svg>