  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Crunchy Cheese Balls -->
    <circle cx="100" cy="115" r="22" fill="#f97316"/>
    <circle cx="140" cy="110" r="20" fill="#ea580c"/>
    <circle cx="120" cy="145" r="24" fill="#fb923c"/>
  
  </g>
</svg>