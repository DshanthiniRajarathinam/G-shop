<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Hazelnut Choco Spread Jar -->
    <rect x="85" y="85" width="70" height="85" rx="14" fill="#3b0764" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="92" y="68" width="56" height="18" rx="5" fill="#dc2626"/>
    <rect x="95" y="105" width="50" height="35" rx="4" fill="#ffffff"/>
    <text x="120" y="128" font-family="Arial" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">CHOCO</text>
  
  </g>
</svg>