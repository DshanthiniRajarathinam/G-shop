<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Kiwi cross section -->
    <circle cx="120" cy="120" r="65" fill="#78350f" />
    <circle cx="120" cy="120" r="58" fill="#84cc16" />
    <circle cx="120" cy="120" r="50" fill="#a3e635" />
    <circle cx="120" cy="120" r="22" fill="#fef08a" />
    <!-- Rays and seeds -->
    <g stroke="#65a30d" stroke-width="1.5">
      <line x1="120" y1="120" x2="120" y2="75"/><line x1="120" y1="120" x2="120" y2="165"/>
      <line x1="120" y1="120" x2="75" y2="120"/><line x1="120" y1="120" x2="165" y2="120"/>
      <line x1="120" y1="120" x2="88" y2="88"/><line x1="120" y1="120" x2="152" y2="152"/>
      <line x1="120" y1="120" x2="88" y2="152"/><line x1="120" y1="120" x2="152" y2="88"/>
    </g>
    <!-- Seeds circle -->
    <circle cx="102" cy="108" r="2.2" fill="#1e293b"/><circle cx="138" cy="108" r="2.2" fill="#1e293b"/>
    <circle cx="102" cy="132" r="2.2" fill="#1e293b"/><circle cx="138" cy="132" r="2.2" fill="#1e293b"/>
    <circle cx="120" cy="94" r="2.2" fill="#1e293b"/><circle cx="120" cy="146" r="2.2" fill="#1e293b"/>
    <circle cx="94" cy="120" r="2.2" fill="#1e293b"/><circle cx="146" cy="120" r="2.2" fill="#1e293b"/>
  
  </g>
</svg>