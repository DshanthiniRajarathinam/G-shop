<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Watermelon slice -->
    <path d="M 40 140 A 90 90 0 0 0 200 140 Z" fill="#15803d" />
    <path d="M 46 138 A 84 84 0 0 0 194 138 Z" fill="#86efac" />
    <path d="M 52 134 A 78 78 0 0 0 188 134 Z" fill="#ef4444" />
    <!-- Seeds -->
    <ellipse cx="90" cy="142" rx="3" ry="5" fill="#1e293b" transform="rotate(-15 90 142)"/>
    <ellipse cx="120" cy="150" rx="3" ry="5" fill="#1e293b" />
    <ellipse cx="150" cy="142" rx="3" ry="5" fill="#1e293b" transform="rotate(15 150 142)"/>
    <ellipse cx="105" cy="160" rx="3" ry="5" fill="#1e293b" transform="rotate(-10 105 160)"/>
    <ellipse cx="135" cy="160" rx="3" ry="5" fill="#1e293b" transform="rotate(10 135 160)"/>
  
  </g>
</svg>