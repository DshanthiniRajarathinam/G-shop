<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Kerala Banana Chips -->
    <ellipse cx="100" cy="110" rx="26" ry="24" fill="#facc15" stroke="#eab308" stroke-width="3" transform="rotate(-15 100 110)"/>
    <circle cx="100" cy="110" r="4" fill="#ca8a04"/>
    <ellipse cx="140" cy="130" rx="26" ry="24" fill="#facc15" stroke="#eab308" stroke-width="3" transform="rotate(20 140 130)"/>
    <circle cx="140" cy="130" r="4" fill="#ca8a04"/>
  
  </g>
</svg>