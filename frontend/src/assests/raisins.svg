<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="105" fill="url(#cardBg)" />
  <g filter="url(#softShadow)">
    
    <!-- Golden Raisins -->
    <ellipse cx="100" cy="110" rx="18" ry="24" fill="#d97706" transform="rotate(15 100 110)"/>
    <ellipse cx="135" cy="105" rx="16" ry="22" fill="#b45309" transform="rotate(-20 135 105)"/>
    <ellipse cx="115" cy="140" rx="19" ry="26" fill="#f59e0b" transform="rotate(45 115 140)"/>
    <ellipse cx="150" cy="135" rx="15" ry="20" fill="#d97706" transform="rotate(-10 150 135)"/>
    <ellipse cx="80" cy="135" rx="14" ry="20" fill="#b45309" transform="rotate(-35 80 135)"/>
  
  </g>
</svg>